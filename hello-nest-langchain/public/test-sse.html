<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE 流式问答 - AI Lab</title>
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(ellipse 60% 50% at 20% 0%, rgba(56, 189, 248, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 85% 10%, rgba(99, 102, 241, 0.16) 0%, transparent 55%),
                linear-gradient(160deg, #f0f7ff 0%, #e8f2fe 40%, #f5f8ff 100%);
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 132, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 132, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 132, 255, 0.22);
            border-radius: 20px;
            box-shadow:
                0 20px 60px rgba(59, 130, 246, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 36px;
            margin-top: 10px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #0284c7, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-tag {
            font-size: 11px;
            font-weight: 600;
            color: #0284c7;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 2px 10px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 28px;
            padding-left: 54px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #question {
            flex: 1;
            padding: 13px 18px;
            border: 1.5px solid #dbeafe;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
        }

        #question:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            background: #fff;
        }

        #question::placeholder {
            color: #94a3b8;
        }

        #askBtn {
            padding: 13px 30px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.25s, transform 0.15s, box-shadow 0.25s;
            white-space: nowrap;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
            letter-spacing: 1px;
        }

        #askBtn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.45);
            transform: translateY(-1px);
        }

        #askBtn:active {
            transform: scale(0.97);
        }

        #askBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            min-height: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            flex-shrink: 0;
            transition: background 0.3s;
            border: 1px solid #94a3b8;
        }

        .status-dot.active {
            background: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        .status-dot.error {
            background: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .status-dot.loading {
            background: #38bdf8;
            border-color: #38bdf8;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        #status {
            font-size: 13px;
            color: #475569;
        }

        .answer-wrapper {
            position: relative;
            background: rgba(248, 251, 255, 0.95);
            border: 1px solid #dbeafe;
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(59, 130, 246, 0.05);
        }

        .answer-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #6366f1, #38bdf8);
            background-size: 200% 100%;
            animation: slide 3s linear infinite;
            z-index: 2;
        }

        @keyframes slide {
            0% {
                background-position: 0% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .answer-scroll {
            max-height: 480px;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .answer-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .answer-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .answer-scroll::-webkit-scrollbar-thumb {
            background: rgba(99, 132, 255, 0.35);
            border-radius: 3px;
        }

        .answer-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 132, 255, 0.6);
        }

        /* ========== Markdown 渲染样式（作用于 .markdown-body 区域） ========== */
        .markdown-body {
            line-height: 1.85;
            font-size: 15px;
            color: #1e293b;
            word-break: break-word;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin-top: 1.2em;
            margin-bottom: 0.5em;
            font-weight: 700;
            color: #0f172a;
        }

        .markdown-body h1 {
            font-size: 1.4em;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3em;
        }

        .markdown-body h2 {
            font-size: 1.2em;
        }

        .markdown-body h3 {
            font-size: 1.1em;
        }

        .markdown-body p {
            margin-bottom: 0.8em;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 0.8em;
            padding-left: 1.6em;
        }

        .markdown-body li {
            margin-bottom: 0.3em;
        }

        .markdown-body strong {
            font-weight: 700;
            color: #0f172a;
        }

        .markdown-body code {
            font-family: "SF Mono", Consolas, "Courier New", monospace;
            font-size: 0.88em;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid #e0e7ff;
            border-radius: 4px;
            padding: 1px 6px;
            color: #4f46e5;
        }

        .markdown-body pre {
            background: #1e293b;
            border-radius: 10px;
            padding: 16px 18px;
            margin: 0.8em 0;
            overflow-x: auto;
        }

        .markdown-body pre code {
            background: none;
            border: none;
            padding: 0;
            color: #e2e8f0;
            font-size: 0.85em;
            line-height: 1.65;
        }

        .markdown-body blockquote {
            border-left: 4px solid #38bdf8;
            padding: 0.5em 1em;
            margin: 0.8em 0;
            background: rgba(56, 189, 248, 0.06);
            border-radius: 0 8px 8px 0;
            color: #475569;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.8em 0;
            font-size: 0.92em;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-body th {
            background: #f1f5f9;
            font-weight: 600;
        }

        .markdown-body tr:nth-child(even) {
            background: #f8fafc;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 1.2em 0;
        }

        .markdown-body a {
            color: #3b82f6;
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.8em 0;
        }

        /* ========== 光标：独立常驻 DOM，动画不因内容刷新而重启 ========== */
        #cursor {
            display: none;
        }

        #cursor.visible {
            display: inline;
        }

        #cursor::after {
            content: "▌";
            color: #6366f1;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .empty-hint {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 50px 20px;
            line-height: 2;
        }

        .empty-hint .big {
            font-size: 44px;
            display: block;
            margin-bottom: 14px;
            filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.35));
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .tip {
            font-size: 12px;
            color: #94a3b8;
        }

        .tip code {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid #e0f2fe;
            border-radius: 4px;
            padding: 1px 6px;
            font-family: "SF Mono", Consolas, monospace;
            font-size: 11px;
            color: #0284c7;
        }

        .clear-btn {
            font-size: 12px;
            color: #64748b;
            background: none;
            border: 1px solid #dbeafe;
            border-radius: 8px;
            padding: 4px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: #38bdf8;
            color: #0284c7;
            background: rgba(56, 189, 248, 0.06);
        }

        .word-count {
            font-size: 12px;
            color: #94a3b8;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">AI</div>
            <h1>SSE Lab · 流式问答</h1>
            <span class="header-tag">STREAMING</span>
        </div>
        <p class="subtitle">通过 Server-Sent Events 实时接收 AI 的回答（逐字流式输出）</p>

        <div class="input-row">
            <input id="question" type="text" placeholder="请输入你的问题，例如：大连有哪些好玩的景点？" />
            <button id="askBtn">提问</button>
        </div>

        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="status">输入问题后点击「提问」开始体验</span>
        </div>

        <div class="answer-wrapper">
            <div class="answer-scroll" id="answerScroll">
                <!-- 空状态占位（无内容时显示） -->
                <div class="empty-hint" id="emptyHint">
                    <span class="big">💬</span>
                    输入问题，点击「提问」<br />AI 的回答将逐字实时展示在这里
                </div>
                <!-- 渲染区域：markdown 内容写这里，光标独立在其后 -->
                <div id="answerBox">
                    <div class="markdown-body"></div>
                </div>
                <span id="cursor"></span>
            </div>
        </div>

        <div class="footer">
            <span class="tip">接口：<code>GET /ai/chat/stream?query=…</code></span>
            <span class="word-count" id="wordCount"></span>
            <button class="clear-btn" id="clearBtn">清空记录</button>
        </div>
    </div>

    <script>
        /* ============ 全局状态 ============ */
        let eventSource = null;
        // 会话令牌：每次 ask() 自增，旧会话的回调发现令牌不匹配则直接忽略
        let sessionToken = 0;
        let rawMarkdown = '';       // 当前会话累计的 markdown 原始文本
        let rafId = null;           // 待执行的渲染帧 id
        let lastRenderLen = 0;      // 已渲染的字符数（加速增量渲染后的滚动定位）

        const questionInput = document.getElementById('question');
        const askBtn = document.getElementById('askBtn');
        const statusDot = document.getElementById('statusDot');
        const statusEl = document.getElementById('status');
        const emptyHint = document.getElementById('emptyHint');
        const markdownBody = document.querySelector('.markdown-body');
        const cursorEl = document.getElementById('cursor');
        const answerScroll = document.getElementById('answerScroll');
        const wordCount = document.getElementById('wordCount');
        const clearBtn = document.getElementById('clearBtn');

        /* ============ 状态与 UI ============ */
        function setStatus(text, type) {
            statusEl.textContent = text;
            statusDot.className = 'status-dot';
            if (type) statusDot.classList.add(type);
        }

        function setLoading(loading) {
            askBtn.disabled = loading;
            askBtn.textContent = loading ? '回答中...' : '提问';
        }

        function showCursor(show) {
            cursorEl.classList.toggle('visible', show);
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                answerScroll.scrollTop = answerScroll.scrollHeight;
            });
        }

        function updateWordCount() {
            const text = rawMarkdown.replace(/\s/g, '');
            wordCount.textContent = text.length > 0 ? `${text.length} 字` : '';
        }

        /* ============ 渲染（rAF 合并，避免每 chunk 整体重排） ============ */
        // 只更新最新的 markdown 内容，并切回空状态占位
        function applyRender() {
            rafId = null;
            lastRenderLen = 0;
            emptyHint.style.display = rawMarkdown ? 'none' : '';
            if (!rawMarkdown) {
                markdownBody.innerHTML = '';
                return;
            }
            markdownBody.innerHTML = marked.parse(rawMarkdown, { breaks: true });
            scrollToBottom();
        }

        // 请求一次渲染：同一帧内多个 chunk 只触发一次，避免高频 innerHTML
        function scheduleRender() {
            if (rafId === null) {
                rafId = requestAnimationFrame(applyRender);
            }
        }

        /* ============ 提问 ============ */
        function ask() {
            const question = questionInput.value.trim();
            if (!question) {
                questionInput.focus();
                questionInput.style.borderColor = '#ef4444';
                setTimeout(() => { questionInput.style.borderColor = ''; }, 1500);
                return;
            }

            // 发起新会话：令牌自增，旧会话的所有回调将被标记为过期
            const token = ++sessionToken;
            doneFlag = false; // 重置完成标记，避免跨会话污染

            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            // 清空上一轮状态
            rawMarkdown = '';
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            showCursor(false);
            applyRender();
            updateWordCount();
            setLoading(true);
            setStatus('正在连接流式接口...', 'loading');

            // 拼 URL 并建立 SSE 连接
            const url = `/ai/chat/stream?query=${encodeURIComponent(question)}`;
            const es = new EventSource(url);
            eventSource = es;

            // 收到数据块：只累计文本，渲染交给 rAF 合并
            es.onmessage = (event) => {
                if (token !== sessionToken) return; // 旧会话，忽略
                const chunk = event.data;
                if (!chunk || !chunk.trim()) return; // 过滤纯空白

                setStatus('正在接收流式回答...', 'active');
                rawMarkdown += chunk;
                showCursor(true);
                updateWordCount();
                scheduleRender();
            };

            // 服务端主动发送的命名事件 done（流正常结束）
            es.addEventListener('done', () => {
                if (token !== sessionToken) return;
                cleanupStream(es, token);
                showCursor(false);
                applyRender();
                setLoading(false);
                setStatus('回答完成', 'active');
                updateWordCount();
                scrollToBottom();
            });

            // 连接关闭/出错：兼容浏览器在服务端正常关闭后也触发 onerror
            es.onerror = () => {
                if (token !== sessionToken) return;
                // 已完成（收到过 done）或已重连中的连接都不算错误
                if (es.readyState === EventSource.CLOSED && !doneFlag) {
                    cleanupStream(es, token);
                    showCursor(false);
                    applyRender();
                    setLoading(false);
                    setStatus('连接失败，请确认服务已启动', 'error');
                    rawMarkdown += '\n\n[连接中断]';
                    applyRender();
                    scrollToBottom();
                }
            };
        }

        // 记录当前连接是否已正常结束，避免 onerror 误报（每次 ask 时重置）
        let doneFlag = false;

        // 统一清理一个 SSE 连接及其状态
        function cleanupStream(es, token) {
            if (token !== sessionToken) return;
            if (eventSource === es) {
                eventSource = null;
            }
            es.close();
            doneFlag = true;
        }

        /* ============ 清空 ============ */
        function clearAll() {
            sessionToken++; // 使所有进行中的会话回调全部失效
            doneFlag = false;
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            rawMarkdown = '';
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            showCursor(false);
            applyRender();
            setLoading(false);
            setStatus('输入问题后点击「提问」开始体验', '');
            wordCount.textContent = '';
        }

        /* ============ 事件绑定 ============ */
        askBtn.addEventListener('click', ask);
        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ask();
        });
        clearBtn.addEventListener('click', clearAll);

        window.addEventListener('beforeunload', () => {
            if (eventSource) eventSource.close();
        });
    </script>
</body>

</html>
